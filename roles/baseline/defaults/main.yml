# Defaults for the baseline role. Anything here can be overridden,
# in group_vars, host_vars, the inventory or with -e.

# Packages every server gets.
baseline_packages:
  - acl
  - htop
  - tree

# Staff accounts to manage: the inventory's bookshop_staff list
# (in group_vars/all.yml), or none if it doesn't have one.
baseline_staff: "{{ bookshop_staff | default([]) }}"
