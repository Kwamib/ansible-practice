# The bookshop servers, described. Run with:  ansible-playbook site.yml
# Dry run first:                              ansible-playbook site.yml --check --diff
# The work is in roles/: baseline for every server, nginx for the web servers.

- name: Baseline for every bookshop server
  hosts: bookshop
  become: true
  roles:
    - baseline

- name: Web servers
  hosts: web
  become: true
  roles:
    - nginx
    - app
