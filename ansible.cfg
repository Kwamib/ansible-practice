[defaults]
inventory = inventory.ini
# The vault password, in a file git ignores.
vault_password_file = .vault_pass
# Find Python on each server by looking, without warning about it.
interpreter_python = auto_silent

[ssh_connection]
# ssh_config is written by: vagrant ssh-config > ssh_config
# It tells SSH each VM's address, user and key.
ssh_args = -F ssh_config
